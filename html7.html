<!DOCTYPE html>
<html>
<head>
    <title>Exercise #2-Registration Form</title>
</head>

<body>

<h2>Registration Form !</h2>

<form>
    <fieldset>

        <h3>Personal details</h3>

        <hr>

        <br>
        <br>
        First name:
        <input type="text">

        <br>
        <br>
        Last name:
        <input type="text">

        <br> 
        <br>

        Email:
        <input type="email">

        <br>
        <br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br>
        <br>

        City:
        <select>
            <option>Amman</option>
            <option>Irbid</option>
        </select>

        <br>
        <br>

        <input type="submit" value="Sign up">

    </fieldset>
</form>

</body>
</html>
