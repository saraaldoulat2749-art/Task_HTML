<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise #2- Image</title>
</head>

<body>

    <h2>Images in Tables</h2>

    <hr>

    <h4>What are your favorite pets ?</h4>

    <table border="1" cellspacing="0" cellpadding="8">
        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a Link)</th>
        </tr>

        <tr>
            <td>
                <img src="OIP.webp" width="200" height="125" alt="Horse">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Horse">
                    Horse
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="th.jpg" width="200" height="125" alt="Dogs">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Dog">
                    Dogs
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="cat.jpg" width="200" height="90" alt="Cats">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Cat">
                    Cats
                </a>
            </td>
        </tr>

    </table>

</body>
</html>
